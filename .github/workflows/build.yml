name: Build Memo Helper HSR Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets in www/
        run: |
          mkdir -p www
          cp -f index.html db_characters.js db_equipment.js db_bosses.js db_mechanics.js www/

      - name: Install Dependencies & Sync Capacitor Android
        run: |
          npm install --no-audit --no-fund
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Assemble Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Memo-Helper-HSR-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
