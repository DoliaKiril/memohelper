name: Build Memo Helper HSR Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> $GITHUB_ENV
          if [ -f "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Prepare Web Assets in www/
        run: |
          mkdir -p www
          cp -f index.html www/index.html
          for f in db_characters.js db_equipment.js db_bosses.js db_mechanics.js; do
            if [ -f "$f" ]; then cp -f "$f" www/; fi
          done
          if [ ! -f "package.json" ]; then
            cat << "EOF" > package.json
          {
            "name": "memo-helper-hsr",
            "version": "5.1.0",
            "main": "index.html",
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/core": "^6.1.2"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.1.2"
            }
          }
          EOF
          fi
          if [ ! -f "capacitor.config.json" ]; then
            cat << "EOF" > capacitor.config.json
          {
            "appId": "com.astralex.memohelper",
            "appName": "Memo Helper HSR",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          fi

      - name: Install & Sync Capacitor Android
        run: |
          npm install --no-audit --no-fund
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Assemble Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Ready Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Memo-Helper-HSR-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
